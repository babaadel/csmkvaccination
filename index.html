<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi vaccination – Kankossa | متابعة التلقيح – كنكوصة</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mut:#64707e;--bd:#dde3ea;--pri:#0f766e;--r:#fde2e2;--rt:#b42318;--w:#fff1d6;--wt:#9a5b00;--g:#dcf5e4;--gt:#1a7f3c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12171d;--card:#1b222b;--tx:#e8edf2;--mut:#9aa6b3;--bd:#2c3642;--pri:#2dd4bf;--r:#4a1d1d;--rt:#ffb4ab;--w:#4a3510;--wt:#ffd37a;--g:#17382a;--gt:#7be3a0}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{background:#006b33;color:#fff}
.gov{display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(135deg,#00843d,#006b33);border-bottom:3px solid #f2c200}
.emb{width:60px;height:60px;flex:none;border-radius:50%}
.gt{display:flex;flex-direction:column;line-height:1.35;font-size:12px;opacity:.95}
.gt b{font-size:14.5px;opacity:1}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;background:#00562a}
.tb h1{font-size:15px;margin:0}.tb small{opacity:.85;display:block;font-weight:400}
button,select,input{font:inherit}
.lang{background:#fff;color:#006b33;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{flex:1;white-space:nowrap;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:980px;margin:0 auto;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.k b{display:block;font-size:26px}.k span{color:var(--mut);font-size:13px}
h2{font-size:15px;margin:18px 0 8px}
.sc{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--bg);color:var(--mut);font-weight:600}
td:first-child,th:first-child{text-align:start}
.s{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.R{background:var(--r);color:var(--rt)}.F{background:var(--w);color:var(--wt)}.S{background:var(--g);color:var(--gt)}
td input{width:70px;padding:5px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);text-align:center}
select{padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.note{color:var(--mut);font-size:13px;margin-top:10px}
.mb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.E{background:#b42318;color:#fff}.ro{background:var(--bg)}.who{font-size:12px;opacity:.9}.cal{flex-basis:100%}.cal .yr{display:flex;align-items:center;gap:12px;margin-bottom:6px;font-weight:700}.cal .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}.cal .g button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:9px 4px;cursor:pointer;font:inherit;font-size:13px}.cal .g button.on{background:var(--pri);color:#fff;border-color:var(--pri)}.cal .g button.cu{box-shadow:inset 0 -3px var(--pri)}.cal .g button.fu{border-style:dashed}.cal .g button:disabled{opacity:.35;cursor:default}
.sm{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer}
.pb{background:var(--pri);color:#fff;border-color:var(--pri)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:90%;max-width:340px}dialog::backdrop{background:#0007}.fi{display:block;width:100%;margin:6px 0;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}.bar .fi{width:auto;margin:0}.hb{display:flex;gap:6px}
.mr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--bd)}.mr>span:first-child{flex:1;min-width:150px}
.dh{background:#1f3b63;color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:6px;text-align:center}.dh b{display:block;font-size:17px;letter-spacing:.5px}.dh span{font-size:12.5px;opacity:.9;font-style:italic}
h2.sh{background:#1f3b63;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;letter-spacing:.3px}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;align-items:start}
.ch{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.cht{font-weight:700;text-align:center;margin-bottom:10px}
.bc{display:flex;align-items:flex-end;gap:2px;height:170px;border-bottom:1px solid var(--bd);padding-top:18px}
.bcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.bb{width:70%;max-width:28px;background:var(--pri);border-radius:4px 4px 0 0}.bv{font-size:11px;color:var(--mut);margin-bottom:2px}
.bl{display:flex;gap:2px;margin-top:4px}.bl span{flex:1;text-align:center;font-size:11px;color:var(--mut);min-width:0;overflow:hidden}
.pie{display:block;width:180px;max-width:70%;margin:0 auto}.pie path,.pie circle{stroke:var(--card);stroke-width:1;stroke-linejoin:round}.pie path:hover{opacity:.85}
.lg{margin-top:10px}.lgi{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}.lgi i{width:12px;height:12px;border-radius:3px;flex:none}.lgi span{flex:1}.lgi small{color:var(--mut);min-width:48px;text-align:end}
.inv th{background:#1f4e78;color:#fff;font-weight:700}.inv td:first-child,.inv th:first-child{text-align:center;width:42px}.inv td:nth-child(2),.inv th:nth-child(2){text-align:start}.inv .itot td{background:#70ad47;color:#fff;font-weight:700}.inv .ng{color:var(--rt);font-weight:700}.inv.dep td:first-child,.inv.dep th:first-child{width:auto;text-align:start}
.xl{max-height:75vh;overflow:auto}.xl th{background:#1f4e78;color:#fff;font-weight:700;position:sticky;top:0;z-index:1}.xl td:nth-child(2){text-align:start}.xl th,.xl td{padding:4px 6px}.xl td input{width:58px;padding:3px}.xl th{white-space:normal;font-size:12.5px;line-height:1.25}
td.xs{font-weight:700;font-size:12px}td.xs.R{background:#f4cccc;color:#9c0006}td.xs.F{background:#ffe8b3;color:#7a4f00}td.xs.S{background:#c6efce;color:#006100}td.xs.E{background:#b42318;color:#fff}
/* ===== impression ===== */
#pr{display:none}
#pr .lh{display:flex;direction:ltr;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:2px solid #006b33;padding-bottom:8px;margin-bottom:12px}
#pr .lh>div{flex:1;font-size:11px;line-height:1.5;text-align:center}
#pr .lh b{display:block;font-size:12.5px}#pr .lh span{display:block}
#pr .lh img{width:80px;height:80px;flex:none}
#pr h3{text-align:center;font-size:16px;margin:10px 0;color:#006b33}
#pr h4{margin:14px 0 4px;font-size:13px}
#pr table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12px}
#pr th,#pr td{border:1px solid #444;padding:5px 6px;text-align:center;white-space:normal;color:#000}
#pr th{background:#e6efe8;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pr td:first-child,#pr th:first-child{text-align:start}
#pr .mt td{text-align:start}
#pr .pR{background:#fde2e2;color:#b42318;font-weight:700}#pr .pF{background:#fff1d6;color:#9a5b00;font-weight:700}#pr .pS{background:#dcf5e4;color:#1a7f3c;font-weight:700}#pr .pE{background:#b42318;color:#fff;font-weight:700}
#pr .pR,#pr .pF,#pr .pS,#pr .pE{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pr .sg{display:flex;justify-content:space-around;margin-top:46px;text-align:center;font-weight:700}
#pr .sg div{min-width:40%}
@media print{
 @page{size:A4;margin:12mm}
 body>*:not(#pr){display:none!important}
 body{background:#fff!important;color:#000!important}
 #pr{display:block!important;background:#fff;color:#000;font:12px/1.45 Tahoma,"Segoe UI",Arial,sans-serif}
 #pr .pg{page-break-after:always}#pr .pg:last-child{page-break-after:auto}
}
</style>
</head>
